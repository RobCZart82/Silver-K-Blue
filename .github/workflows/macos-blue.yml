name: Silver-K Blue macOS Universal 2
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      keep_release:
        description: Save successful package as a durable private Release
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: macos-blue-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify release source selection and upstream tooling
        run: python -m unittest discover -s tools -p "test_*sources.py"
      - name: Verify upstream update safety
        run: python tools/test_sync_blue_upstream.py
      - name: Configure macOS Universal 2 Release
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
      - name: Build VST3, Standalone and ROM-free checks
        run: cmake --build build --config Release --target silverK_VST3 silverK_AU silverK_Standalone silver_check silverClock_test silverLatency_test silverEditor_test silverPerformance_test silverEmbeddedSkin_test silverFramework_test --parallel 3
      - name: Run ROM-free checks
        env:
          SILVER_K_DATA: ${{ runner.temp }}/silver-blue-tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error -R '^(silver_conversion|silver_host_clock|silver_latency_reentry|silver_native_editor|silver_performance_editor|silver_embedded_blue|silver_framework_safety)$'
      - name: Package Windows products and both Blue skins
        run: python tools/package_blue_windows.py --products build/source/novation/silverK/buildStandalone/silverPlugin/silverK_artefacts/Release --output blue-output --platform macOS-Universal2
      - name: Upload private download package
        uses: actions/upload-artifact@v4
        with:
          name: Silver-K-Blue-macOS-Universal2-${{ github.run_number }}
          path: blue-output/*
          if-no-files-found: error
          retention-days: 30
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-build-diagnostics-${{ github.run_number }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 14
  keep-private-release:
    needs: macos
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.keep_release }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Silver-K-Blue-macOS-Universal2-${{ github.run_number }}
          path: release-files
      - name: Preserve build in a private repository Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create "macos-blue-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" release-files/* \
            --target "$GITHUB_SHA" \
            --title "Silver-K Blue macOS Universal 2 build ${GITHUB_RUN_NUMBER}" \
            --notes "Private macOS Universal 2 test build. Source commit: ${GITHUB_SHA}. Includes AU, VST3, Standalone and both embedded Blue skins. No proprietary firmware. ROM-free checks passed; interactive macOS audio/DAW testing is separate."

