name: Silver-K Blue Windows x64
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-blue-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify release source selection and upstream tooling
        run: python -m unittest discover -s tools -p "test_*sources.py"
      - name: Verify upstream update safety
        run: python tools/test_sync_blue_upstream.py
      - name: Test Blue download packaging
        run: python tools/test_blue_package.py
      - name: Verify unified release validation
        run: python tools/test_publish_blue_release.py
      - name: Configure Windows x64 Release
        run: cmake -S . -B build -A x64
      - name: Build VST3, Standalone and ROM-free checks
        run: cmake --build build --config Release --target silverK_VST3 silverK_Standalone silver_check silverClock_test silverLatency_test silverEditor_test silverPerformance_test silverEmbeddedSkin_test silverFramework_test silverInputDiagnostics_test silverAudioInput_test ksAudioInput_test silverWorkflow_test silverPersistence_test silverSkin_test silverResamplerRealtime_test --parallel 4
      - name: Run ROM-free checks
        env:
          SILVER_K_DATA: ${{ runner.temp }}/silver-blue-tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error -R '^(silver_conversion|silver_host_clock|silver_audio_input_safety|ks_audio_input|silver_native_editor|silver_performance_editor|silver_embedded_blue|silver_framework_safety|silver_input_diagnostics|silver_patch_workflow|silver_persistence_and_rescan|silver_skin_packages|silver_resampler_realtime)$'
      - name: Report firmware-required latency check (SKIP without private ROMs)
        env:
          SILVER_K_DATA: ${{ runner.temp }}/silver-blue-tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error -R '^silver_latency_reentry$'
      - name: Package platform products and both Blue skins
        run: python tools/package_blue_windows.py --products build/source/novation/silverK/buildStandalone/silverPlugin/silverK_artefacts/Release --output blue-output
      - name: Upload download package
        uses: actions/upload-artifact@v4
        with:
          name: Silver-K-Blue-Windows-x64-${{ github.run_number }}
          path: blue-output/*
          if-no-files-found: error
          retention-days: 30
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-diagnostics-${{ github.run_number }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 14
