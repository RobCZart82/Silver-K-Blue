name: Silver-K Blue Windows x64
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-blue-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure Windows x64 Release
        run: cmake -S . -B build -A x64
      - name: Build VST3, Standalone and ROM-free checks
        run: cmake --build build --config Release --target silverK_VST3 silverK_Standalone silver_check silverClock_test silverLatency_test silverEditor_test silverPerformance_test --parallel 4
      - name: Run ROM-free checks
        env:
          SILVER_K_DATA: ${{ runner.temp }}/silver-blue-tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error -R '^(silver_conversion|silver_host_clock|silver_latency_reentry|silver_native_editor|silver_performance_editor)$'
      - name: Package Windows products and both Blue skins
        run: python tools/package_blue_windows.py --products build/source/novation/silverK/buildStandalone/silverPlugin/silverK_artefacts/Release --output blue-output
      - name: Upload private download package
        uses: actions/upload-artifact@v4
        with:
          name: Silver-K-Blue-Windows-x64-${{ github.run_number }}
          path: blue-output/*
          if-no-files-found: error
          retention-days: 30
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-diagnostics-${{ github.run_number }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 14
